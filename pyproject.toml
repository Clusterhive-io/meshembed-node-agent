[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshembed-node"
version = "0.3.10"
description = "MeshEmbed Node - GPU worker daemon for the MeshEmbed distributed embedding network"
requires-python = ">=3.10"
# Version pins below exist because the script-path install (install-mac.sh) lets
# pip pick the newest of everything. On Intel Mac, the newest torch wheel is
# 2.2.2; pip happily pairs it with numpy 2.x (ABI mismatch) and transformers
# 4.46+ (which assumes torch 2.4+ and crashes with `NameError: nn`). Pin to a
# tested triplet that resolves on every supported OS/arch.
dependencies = [
    "requests>=2.32",
    "psutil>=6.0",
    "numpy>=1.26,<2",
    "torch>=2.2,<2.4",
    "transformers>=4.41,<4.45",
    "sentence-transformers>=3.0,<3.4",
    "cryptography>=42.0",
    # pynvml is optional - without it GPU model/VRAM report "none"/0
]

[project.optional-dependencies]
gpu = ["pynvml>=11.5"]

[project.scripts]
meshembed-node = "meshembed_node.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["meshembed_node*"]
